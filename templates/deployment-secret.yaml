# ============================================================
# Шаблон к заданию 3. Deployment — переменные из Secret
# ------------------------------------------------------------
# Secret уже создан командой kubectl create secret (задание 3, шаг 1).
# Здесь подключаем ОТДЕЛЬНЫЕ ключи (не весь Secret целиком).
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: calc-app
  namespace: demo

spec:
  replicas: 1
  selector:
    matchLabels:
      app: calc-app
  template:
    metadata:
      labels:
        app: calc-app
    spec:
      containers:
        - name: calc-app
          image: calc-app:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            # DB_USER возьмётся из ключа username секрета db-credentials
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: <ВПИШИТЕ имя secret>     # db-credentials
                  key: <ВПИШИТЕ ключ>            # username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: <ВПИШИТЕ имя secret>
                  key: <ВПИШИТЕ ключ>            # password

# ------------------------------------------------------------
#   kubectl apply -f deployment-secret.yaml
#   curl http://localhost:5000/config   (через port-forward)
# ------------------------------------------------------------
