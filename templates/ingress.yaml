# ============================================================
# Шаблон к заданию 5. Ingress — маршрут по имени хоста
# ------------------------------------------------------------
# Предусловие: minikube addons enable ingress (задание 0)
# и Service calc-service типа ClusterIP (задание 4).
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calc-ingress # calc-ingress
  namespace: demo # demo
spec:
  rules:
    # Все запросы к этому имени хоста пойдут по правилу ниже:
    - host: calc.local # calc.local
      http:
        paths:
          - path: / # весь сайт
            pathType: Prefix
            backend:
              service:
                name: calc-service # calc-service
                port:
                  number: 80 # 80
    - host: web.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80

# ------------------------------------------------------------
#   kubectl apply -f ingress.yaml
#   echo "$(minikube ip) calc.local" | sudo tee -a /etc/hosts
#   curl http://calc.local/health
# ------------------------------------------------------------
