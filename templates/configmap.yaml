# ============================================================
# Шаблон к заданию 1. ConfigMap — настройки приложения
# ------------------------------------------------------------
# ConfigMap = пары ключ-значение в кластере. Приложение читает их
# как переменные окружения — образ остаётся тем же.
# ============================================================

apiVersion: v1          # ConfigMap — в базовой API-группе
kind: ConfigMap

metadata:
  name: <ВПИШИТЕ имя configmap>        # договоримся: calc-config
  namespace: <ВПИШИТЕ namespace>       # demo

data:
  # ВНИМАНИЕ: значения в ConfigMap — всегда строки (в кавычках).
  APP_NAME: <ВПИШИТЕ "calc-prod">
  CALC_PRECISION: <ВПИШИТЕ "4">        # сколько знаков после запятой

# ------------------------------------------------------------
# После заполнения:
#   kubectl apply -f configmap.yaml
#   kubectl describe configmap calc-config -n demo
# ------------------------------------------------------------
