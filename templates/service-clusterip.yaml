apiVersion: v1
kind: Service

metadata:
  name: <ВПИШИТЕ имя service>          # calc-service
  namespace: <ВПИШИТЕ namespace>       # demo

spec:
  type: <ВПИШИТЕ тип>                  # ClusterIP
  selector:
    app: <ВПИШИТЕ label>               # как у подов: calc-app
  ports:
    - port: <ВПИШИТЕ порт сервиса>      # 80
      targetPort: <ВПИШИТЕ порт контейнера>   # 5000

# ------------------------------------------------------------
#   kubectl apply -f service-clusterip.yaml
#   kubectl get svc -n demo
# ------------------------------------------------------------
