# ============================================================
# Шаблон к заданию 4. Service — тип ClusterIP
# ------------------------------------------------------------
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: calc-service # calc-service
  namespace: demo # demo
spec:
  type: ClusterIP # ClusterIP
  selector:
    app: calc-app # как у подов: calc-app
  ports:
    - port: 80 # 80
      targetPort: 5000 # 5000

# ------------------------------------------------------------
#   kubectl apply -f service-clusterip.yaml
#   kubectl get svc -n demo
# ------------------------------------------------------------
