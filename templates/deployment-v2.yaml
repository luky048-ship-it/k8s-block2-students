# ============================================================
# Шаблон к заданию 1. Deployment v2 — приложение + ConfigMap
# ------------------------------------------------------------
# Шаг 1: заполните пропуски и задеплойте БЕЗ envFrom (умолчания).
# Шаг 3: раскомментируйте блок envFrom и примените снова.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calc-app # calc-app
  namespace: demo # demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calc-app
  template:
    metadata:
      labels:
        app: calc-app
    spec:
      containers:
        - name: calc-app
          image: calc-app:v2
          imagePullPolicy: Never # локальный образ → ?
          ports:
            - containerPort: 5000 # 5000
              # ---------- ШАГ 3: раскомментируйте ----------------
              # envFrom подключает ВСЕ ключи ConfigMap как переменные
          # окружения контейнера:

          envFrom:
            - configMapRef:
                name: calc-config # calc-config

# ------------------------------------------------------------
#   kubectl apply -f deployment-v2.yaml
#   kubectl rollout status deployment/calc-app -n demo
#   kubectl port-forward deployment/calc-app 5000:5000 -n demo &
#   curl http://localhost:5000/config
# ------------------------------------------------------------
