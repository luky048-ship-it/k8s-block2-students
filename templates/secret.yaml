# ============================================================
# Шаблон к заданию 8. Secret декларативно (значения в base64!)
# ------------------------------------------------------------
# Закодировать:  echo -n "значение" | base64
# Раскодировать: echo "..." | base64 -d
# ============================================================

apiVersion: v1
kind: Secret

metadata:
  name: <ВПИШИТЕ имя secret>           # api-token
  namespace: <ВПИШИТЕ namespace>       # demo

type: Opaque

data:
  # ВПИШИТЕ base64 от "newpassword":
  password: <ВПИШИТЕ base64>

# ------------------------------------------------------------
#   kubectl apply -f secret.yaml
#   kubectl get secret api-token -n demo -o jsonpath='{.data.password}' | base64 -d
# ------------------------------------------------------------
