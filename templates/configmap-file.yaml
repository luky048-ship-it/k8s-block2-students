# ============================================================
# Шаблон к заданию 2. ConfigMap — целый конфигурационный файл
# ------------------------------------------------------------
# В data можно положить не только пары ключ-значение, но и файл.
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: calc-file-config # calc-file-config
  namespace: demo # demo
data:
  # Ключ — это имя будущего файла, значение — его содержимое.
  # Многострочный текст пишется через | (вертикальная черта) с отступом.
  app.conf: |
    # Конфигурация калькулятора
    app_name = calc-file
    precision = 4
    mode = debug
